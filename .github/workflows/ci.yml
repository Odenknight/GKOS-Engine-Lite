name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Linux blocking / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Lockfile SHA guard (git deps must pin to a commit SHA)
        run: node scripts/check-lockfile-sha.mjs
      - name: License and Engine pin consistency
        run: npm run check:metadata
      - run: npm ci
      - run: npm test
      - name: Package contents smoke test
        run: npm pack --dry-run

  node-23-informative:
    name: Linux informative / Node 23
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "23"
      - name: Lockfile SHA guard (git deps must pin to a commit SHA)
        run: node scripts/check-lockfile-sha.mjs
      - name: License and Engine pin consistency
        run: npm run check:metadata
      - run: npm ci
      - run: npm test
      - name: Package contents smoke test
        run: npm pack --dry-run

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci
      - name: Typecheck frontend
        working-directory: desktop
        run: npm run typecheck
      - name: Frontend logic tests
        working-directory: desktop
        run: npm test
      - name: Frontend build
        working-directory: desktop
        run: npm run build

  desktop-native:
    name: Windows desktop-native / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build desktop frontend for Tauri context
        working-directory: desktop
        run: npm run build
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: desktop/src-tauri -> target
      - name: Acquire digest-pinned compile assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/resources | Out-Null
          gh release download v1.1.3 --repo Odenknight/GKOS-Engine --pattern kosmos-agent-x86_64-pc-windows-msvc.exe --output desktop/src-tauri/binaries/kosmos-agent-x86_64-pc-windows-msvc.exe
          gh release download viewer-v0.6.9-rc1 --repo Odenknight/Kosmos-Oden --pattern vault-kosmos.html --output desktop/src-tauri/resources/vault-kosmos.html
          $engineHash = (Get-FileHash -Algorithm SHA256 desktop/src-tauri/binaries/kosmos-agent-x86_64-pc-windows-msvc.exe).Hash.ToLowerInvariant()
          $viewerHash = (Get-FileHash -Algorithm SHA256 desktop/src-tauri/resources/vault-kosmos.html).Hash.ToLowerInvariant()
          if ($engineHash -ne "29ab43c9ce79b8c14978594a18523a04e3f7518d87560f1e4c17744da08f12c2") {
            throw "GKOS-Engine compile asset digest mismatch"
          }
          if ($viewerHash -ne "11e004a5e500f5bb196ec321eefd0cd7f9dd332715edc4b1b71f286a10e768dd") {
            throw "Kosmos-Oden viewer compile asset digest mismatch"
          }
      - name: Windows frontend and packaged REST tests
        working-directory: desktop
        run: npm test
      - name: Native Tauri tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

  retrieval-rust-msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup declared Rust MSRV
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust -> target
      - name: Test retrieval core at MSRV, including bundled FTS5 smoke test
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Enforce sealed retrieval API at MSRV
        run: cargo test --manifest-path rust/Cargo.toml --workspace --doc --locked

  retrieval-rust-latest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup reviewed current Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust -> target
      - name: Formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Tests, including Full contract conformance and bundled FTS5
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Enforce sealed retrieval API
        run: cargo test --manifest-path rust/Cargo.toml --workspace --doc --locked
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

  retrieval-rust-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup reviewed Windows Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust -> target
      - name: Check retrieval core on Windows MSVC
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Test retrieval core and bundled FTS5 on Windows MSVC
        env:
          GKOS_REQUIRE_ALIAS_FIXTURE: "1"
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
      - name: Enforce sealed retrieval API on Windows MSVC
        run: cargo test --manifest-path rust/Cargo.toml --workspace --doc --locked
