name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lockfile SHA guard (git deps must pin to a commit SHA)
        run: node scripts/check-lockfile-sha.mjs
      - name: License and Engine pin consistency
        run: npm run check:metadata
      - run: npm ci
      - run: npm test
      - name: Package contents smoke test
        run: npm pack --dry-run

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci
      - name: Typecheck frontend
        working-directory: desktop
        run: npm run typecheck
      - name: Frontend logic tests
        working-directory: desktop
        run: npm test
      - name: Frontend build
        working-directory: desktop
        run: npm run build
