name: desktop-build

# Builds the unsigned GKOS Engine Desktop installers (.dmg / .exe NSIS) on the
# CI matrix. Rust/Tauri compilation happens ONLY here — there is no local Rust
# toolchain. Trigger manually, or on a `desktop-v*` tag to cut a Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

# Sidecar binaries come from the matching GKOS-Engine release (public repo, no
# auth needed for the download). If those assets are missing, fall back to
# building the SEA from that same tag.
env:
  ENGINE_REPO: Odenknight/GKOS-Engine
  # v1.1.3 is the first engine release whose sidecar-release publishes
  # kosmos-agent-x86_64-apple-darwin correctly signed on every leg (cross-arch
  # SEA, GKOS-Engine#9; codesign fix, GKOS-Engine#12). Must be
  # tagged upstream before this workflow is run for the Intel target.
  ENGINE_TAG: v1.1.3

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            asset: kosmos-agent-aarch64-apple-darwin
            binext: ""
            sea_args: ""
          # Intel macOS, built on the arm64 runner. Two halves make this work:
          # Tauri/cargo cross-compiles to x86_64-apple-darwin on an Apple
          # Silicon host given the rustup target, and GKOS-Engine's
          # build-sea.mjs cross-builds the x86_64 sidecar via --target-arch x64. v1.1.1
          # and v1.1.2 both shipped this broken (arm64 leg failed its own codesign
          # verify); v1.1.3 fixes it — see GKOS-Engine#12.
          # Previously this leg needed a dedicated Intel runner, whose pool
          # queued for ~24h and left the x64 .dmg unpublished in rc3/rc4.
          - platform: macos-latest
            target: x86_64-apple-darwin
            asset: kosmos-agent-x86_64-apple-darwin
            binext: ""
            sea_args: "--target-arch x64"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            asset: kosmos-agent-x86_64-pc-windows-msvc.exe
            binext: ".exe"
            sea_args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # dtolnay/rust-toolchain's `targets:` input already runs the equivalent
      # of `rustup target add`. Assert it took effect: on the arm64 runner the
      # x86_64-apple-darwin std must be present or `tauri build --target` will
      # fail deep inside cargo with a much noisier error.
      - name: Verify Rust target is installed
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          rustup target list --installed
          rustup target list --installed | grep -qx "${{ matrix.target }}"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Generate app icons (unsigned; deterministic from app-icon.png)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 icon src-tauri/app-icon.png

      - name: Acquire kosmos-agent sidecar
        shell: bash
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          dest="src-tauri/binaries/kosmos-agent-${{ matrix.target }}${{ matrix.binext }}"
          echo "Trying to download ${{ matrix.asset }} from ${ENGINE_REPO}@${ENGINE_TAG}…"
          if gh release download "${ENGINE_TAG}" \
               --repo "${ENGINE_REPO}" \
               --pattern "${{ matrix.asset }}" \
               --output "${dest}" ; then
            echo "Downloaded sidecar from release assets."
          else
            echo "Release asset missing — falling back to building the SEA in-run."
            git clone --depth 1 --branch "${ENGINE_TAG}" "https://github.com/${ENGINE_REPO}.git" ../engine-src
            pushd ../engine-src
            npm ci
            npm run build
            # Matches the engine's cross-arch script (GKOS-Engine#9): the Intel
            # leg passes --target-arch x64 so the SEA is injected into a
            # checksum-verified darwin-x64 node rather than the arm64 host's.
            node scripts/build-sea.mjs ${{ matrix.sea_args }}
            # build-sea.mjs emits dist/kosmos-agent-<target-triple>[.exe] for
            # exactly the target selected above.
            cp "dist/kosmos-agent-${{ matrix.target }}${{ matrix.binext }}" "../desktop/${dest}"
            popd
          fi
          chmod +x "${dest}" || true
          test -s "${dest}"

          if [ "$RUNNER_OS" = "macOS" ]; then
            file "${dest}"
            expect_macho='${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}'
            # Hard gate: a wrong-arch sidecar would be bundled silently and only
            # fail on the end user's machine.
            file "${dest}" | grep -q "Mach-O 64-bit executable $expect_macho"
            codesign --verify --verbose=2 "${dest}"
          fi

          # Functional gate. An x86_64 sidecar on the arm64 runner needs
          # Rosetta 2; probe for it and report the outcome explicitly rather
          # than skipping quietly.
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] && [ "$(uname -m)" = "arm64" ] \
             && ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            echo "::warning::Rosetta 2 unavailable; the x86_64 sidecar passed its Mach-O arch and signature gates but could not be executed on this runner. Its functional coverage is the GKOS-Engine sidecar-release smoke test for the same asset."
          else
            "${dest}" --help | grep -q "protected, read-only note map"
            echo "sidecar functional smoke test passed"
          fi
          ls -la src-tauri/binaries

      - name: Acquire standalone 3D viewer (vault-kosmos.html)
        shell: bash
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pinned to the viewer release known-good at authoring time. For a
          # future bump, change VIEWER_TAG (or switch to the newest viewer-v*
          # via `gh release list --repo Odenknight/Kosmos-Oden`).
          VIEWER_REPO=Odenknight/Kosmos-Oden
          VIEWER_TAG=viewer-v0.6.9-rc1
          mkdir -p public src-tauri/resources
          echo "Downloading vault-kosmos.html from ${VIEWER_REPO}@${VIEWER_TAG}…"
          gh release download "${VIEWER_TAG}" \
            --repo "${VIEWER_REPO}" \
            --pattern vault-kosmos.html \
            --output src-tauri/resources/vault-kosmos.html --clobber
          test -s src-tauri/resources/vault-kosmos.html
          # Frontend copy: vite copies public/ into the build (frontendDist), so
          # the in-app window can load it over the Tauri protocol. The resources/
          # copy is read at runtime for the browser fallback.
          cp src-tauri/resources/vault-kosmos.html public/vault-kosmos.html
          ls -la public/vault-kosmos.html src-tauri/resources/vault-kosmos.html

      - name: Build unsigned bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing config: unsigned build (owner decision 1). macOS
          # notarization is intentionally skipped.
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}
          # On a desktop-v* tag, publish a GitHub Release with the artifacts and
          # the standard unsigned disclaimer. On workflow_dispatch, artifacts
          # stay attached to the run only.
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'GKOS Engine Desktop __VERSION__' || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'Unsigned pre-release build. Your OS will warn you when you first open it — this is expected for an unsigned app. See the install guide (desktop/docs/QUICKSTART.md and USER-GUIDE.md) for the macOS right-click → Open / xattr fallback and the Windows SmartScreen More info → Run anyway steps. Loopback-only, read-only, no cloud access.' || '' }}
          releaseDraft: false
          prerelease: true

      - name: Upload run artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: gkos-engine-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
