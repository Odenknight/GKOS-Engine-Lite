[workspace]
members = ["crates/gkos-retrieval"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["OdenKnight"]
repository = "https://github.com/Odenknight/GKOS-Engine-Lite"

[workspace.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "=1.0.145"
serde-value = "=0.7.0"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
toml = "=0.8.23"
unicode-normalization = "=0.1.24"
windows-sys = "=0.61.2"
futures-executor = "=0.3.31"
futures-timer = "=3.0.3"
futures-util = "=0.3.31"
